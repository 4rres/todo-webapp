<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { background: #f0ebe0; min-height: 100vh; }

.app { display: flex; flex-direction: column; height: 100vh; }

/* Tabs */
.tabs { display: flex; align-items: center; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid #ddd8cc; background: #e8e3d8; }
.tab { padding: 6px 14px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 500; cursor: pointer; background: transparent; color: #888; border: none; }
.tab.active { background: #f0ebe0; color: #333; }
.tab-add { padding: 6px 10px; color: #aaa; font-size: 16px; cursor: pointer; background: none; border: none; }

/* Toolbar */
.toolbar { padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.toolbar-title { font-size: 18px; font-weight: 600; color: #2a2a2a; flex: 1; text-align: center; }
.btn-new { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 5px 12px; font-size: 13px; color: #555; cursor: pointer; }

/* Workspace */
.workspace { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Dump card (full width, tall) */
.card-dump { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); width: 100%; }
.card-dump .card-title { font-weight: 600; font-size: 15px; color: #2a2a2a; margin-bottom: 10px; }
.todo-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; color: #444; }
.todo-item input[type=checkbox] { width: 14px; height: 14px; accent-color: #7c6f5c; cursor: pointer; flex-shrink: 0; }
.todo-item.done label { text-decoration: line-through; color: #aaa; }
.progress { font-size: 11px; color: #999; margin: 8px 0 4px; }

/* Grid of project cards */
.cards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.card { background: white; border-radius: 10px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); min-height: 120px; }
.card .card-title { font-weight: 600; font-size: 14px; color: #2a2a2a; margin-bottom: 8px; }

/* Status tags */
.tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 500; }
.tag-progress { background: #dbeafe; color: #2563eb; }
.tag-wait { background: #fef3c7; color: #d97706; }
.tag-review { background: #ede9fe; color: #7c3aed; }
.tag-done { background: #d1fae5; color: #059669; }

.todo-item .tag { margin-left: auto; }
</style>
